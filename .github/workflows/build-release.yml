name: Build & Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    env:
      SOLUTION: Dopamine.sln
      PROJECT: Dopamine\Dopamine.csproj
      BUILD_CONFIGURATION: Release
      BUILD_PLATFORM: AnyCPU

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $output = & msbuild $env:SOLUTION -t:restore -p:RestorePackagesConfig=true /v:minimal /nologo 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $errors = $output | Where-Object { $_ -match ':\s*error\b' -or $_ -match 'error (CS|MSB|NU)\d+' }
            if (-not $errors) { $errors = $output | Select-Object -Last 25 }
            $errors | Select-Object -First 25 | ForEach-Object { Write-Host "::error::$_" }
          }
          exit $code

      # Build only the application project. The reference assemblies the app needs
      # (Windows.winmd and System.Runtime.WindowsRuntime.dll) are vendored under
      # Dopamine\Libraries, so no Windows SDK installation is required on the runner.
      - name: Build
        shell: pwsh
        run: |
          $output = & msbuild $env:PROJECT /p:Configuration=$env:BUILD_CONFIGURATION "/p:Platform=$env:BUILD_PLATFORM" /m /v:minimal /nologo 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $errors = $output | Where-Object { $_ -match ':\s*error\b' -or $_ -match 'error (CS|MSB|NU)\d+' }
            if (-not $errors) { $errors = $output | Select-Object -Last 20 }
            $errors | Select-Object -First 25 | ForEach-Object { Write-Host "::error::$_" }
            "### Build failed (exit code $code)" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            ($errors | Select-Object -First 100) | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
          exit $code

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          $version = $ref -replace '^[vV]', ''
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '0.0.0' }
          Write-Host "Version: $version"
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Create portable package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $src = Join-Path $env:GITHUB_WORKSPACE 'Dopamine\bin\Release'
          if (-not (Test-Path -LiteralPath $src)) { throw "Build output not found at $src" }

          $stage = Join-Path $env:GITHUB_WORKSPACE 'package\Dopamine'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $excludeNames = @(
            'Dopamine.Packager.exe',
            'Dopamine.Packager.exe.config',
            'Dopamine.Packager.pdb',
            'PackagerConfiguration.xml'
          )

          $srcFull = (Resolve-Path -LiteralPath $src).Path

          Get-ChildItem -LiteralPath $src -Recurse -File | Where-Object {
            $_.Extension -ne '.pdb' -and ($excludeNames -notcontains $_.Name)
          } | ForEach-Object {
            $rel = $_.FullName.Substring($srcFull.Length).TrimStart('\')
            $dest = Join-Path $stage $rel
            New-Item -ItemType Directory -Force -Path (Split-Path -LiteralPath $dest) | Out-Null
            Copy-Item -LiteralPath $_.FullName -Destination $dest -Force
          }

          $zipName = "Dopamine-Portable-${{ steps.version.outputs.value }}.zip"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE $zipName

          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'package\Dopamine') -DestinationPath $zipPath -Force

          Write-Host "Created $zipPath"
          "path=$zipPath" >> $env:GITHUB_OUTPUT
          "name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Create installer
        id: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe', 'C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup.' }

          $version = '${{ steps.version.outputs.value }}'
          $src = Join-Path $env:GITHUB_WORKSPACE 'Dopamine\bin\Release'

          & $iscc "/DMyAppVersion=$version" "/DSourceDir=$src" (Join-Path $env:GITHUB_WORKSPACE 'installer\Dopamine.iss')
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed (exit $LASTEXITCODE)." }

          $setup = Join-Path $env:GITHUB_WORKSPACE "installer\Output\Dopamine-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Installer not found: $setup" }

          Write-Host "Created $setup"
          "path=$setup" >> $env:GITHUB_OUTPUT
          "name=Dopamine-Setup-$version.exe" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-${{ steps.version.outputs.value }}
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = '${{ steps.package.outputs.path }}'
          $setup = '${{ steps.installer.outputs.path }}'

          # This repository may have immutable releases: assets can only be attached
          # before a release is published. So create it as a draft, upload the
          # assets, then publish it and mark it as the latest release.
          gh release create $tag $zip $setup --title $tag --generate-notes --draft
          gh release edit $tag --draft=false --latest
